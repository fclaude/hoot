[package]
name = "hoot"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for reviewing a git working tree alongside an AI coding agent (opencode or pi)"
license = "MIT"
repository = "https://github.com/fclaude/hoot"
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Built with `cargo install cargo-deb` + `cargo deb`. See packaging/README.md.
[package.metadata.deb]
maintainer = "Francisco Claude-Faust <fclaude@recoded.cl>"
copyright = "2026, Francisco Claude-Faust <fclaude@recoded.cl>"
extended-description = """\
A terminal UI for reviewing a git working tree alongside an AI coding \
agent (opencode by default, or pi): see what changed, chat with the \
agent, and pick exactly which hunks go into a commit."""
# No `procps` here any more: finding the backend's descendants reads
# /proc directly on Linux, so `ps` is only needed on macOS, which isn't
# what a .deb installs onto. Declaring it would be asking for a package
# nothing here calls.
depends = "$auto, git"
section = "utils"
priority = "optional"
assets = [
    ["target/release/hoot", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/hoot/README.md", "644"],
    ["KEYBINDINGS.md", "usr/share/doc/hoot/KEYBINDINGS.md", "644"],
]

# Built with `cargo install cargo-generate-rpm` + `cargo build --release`
# then `cargo generate-rpm`. See packaging/README.md.
[package.metadata.generate-rpm]
license = "MIT"
assets = [
    { source = "target/release/hoot", dest = "/usr/bin/hoot", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/hoot/README.md", mode = "644", doc = true },
    { source = "KEYBINDINGS.md", dest = "/usr/share/doc/hoot/KEYBINDINGS.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = "*"
