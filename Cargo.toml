[package]
name = "steer"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for reviewing a git working tree alongside the pi coding agent"
license = "MIT"
repository = "https://github.com/fclaude/steer"
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Built with `cargo install cargo-deb` + `cargo deb`. See packaging/README.md.
[package.metadata.deb]
maintainer = "Francisco Claude-Faust <fclaude@recoded.cl>"
copyright = "2026, Francisco Claude-Faust <fclaude@recoded.cl>"
extended-description = """\
A terminal UI for reviewing a git working tree while steering the pi \
coding agent inside it: see what changed, chat with the agent, and pick \
exactly which hunks go into a commit."""
depends = "$auto, git"
section = "utils"
priority = "optional"
assets = [
    ["target/release/steer", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/steer/README.md", "644"],
    ["KEYBINDINGS.md", "usr/share/doc/steer/KEYBINDINGS.md", "644"],
]

# Built with `cargo install cargo-generate-rpm` + `cargo build --release`
# then `cargo generate-rpm`. See packaging/README.md.
[package.metadata.generate-rpm]
license = "MIT"
assets = [
    { source = "target/release/steer", dest = "/usr/bin/steer", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/steer/README.md", mode = "644", doc = true },
    { source = "KEYBINDINGS.md", dest = "/usr/share/doc/steer/KEYBINDINGS.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = "*"
