# Builds release binaries + a .deb and .rpm, installs each package on the
# distribution it targets to confirm it actually works, and attaches them
# all to a GitHub Release, whenever a `vX.Y.Z` tag is pushed.
#
# Deliberately uses native runners per architecture where they still exist
# (Linux x86_64/arm64) instead of `cross` or Docker-based cross-compilation
# — hoot has no C dependencies, so there's nothing a cross toolchain buys
# there that a native build doesn't already give for free. macOS: GitHub
# retired the free-tier Intel macOS runner (macos-13) in December 2025, and
# macos-14's deprecation is already underway (unsupported November 2, 2026)
# — both Mac rows use macos-15 (arm64) / macos-15-intel (x64) instead of
# building both on one Apple Silicon runner, so neither target needs
# cross-compilation at all.
#
# What this does NOT do: push to Homebrew, COPR, or the AUR. Those each
# need their own account/repo that only a human can set up (see
# packaging/README.md) — this workflow just produces the raw artifacts
# those live downstream of.
#
# Every action is pinned to a commit SHA, not a mutable tag, and each job
# gets only the permissions it actually needs — see
# https://docs.github.com/actions/security-guides/security-hardening-for-github-actions.

name: release

on:
  push:
    tags: ["v*.*.*"]

# The `check` job below duplicates ci.yml's checks deliberately: a tag can
# be pushed to a commit that never went through a PR, and a release that
# skips its own gate isn't gated.

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Dependency advisory scan
        # `-D warnings` denies on *any* advisory, not just a real
        # vulnerability — an unmaintained crate or a soundness bug are
        # worth failing on too, and this way a genuinely new one can't
        # slip through silently the way a bare `cargo audit` does
        # (informational advisories don't fail it by default). The three
        # `--ignore`s below are a deliberate, reviewed exception list, not
        # neglect: all three are transitive through ratatui itself (not
        # a dependency hoot could bump independently), and hoot doesn't
        # exercise the specific unsound lru APIs (LruCache::pop's panic-
        # safety issue, IterMut's Stacked-Borrows violation) at all.
        # Revisit whenever ratatui's own deps move.
        run: |
          cargo install cargo-audit@0.22.2 --locked
          cargo audit -D warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0253

      - name: Tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag v$tag_version doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    needs: check
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          set -euo pipefail
          stage="hoot-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$stage"
          cp target/${{ matrix.target }}/release/hoot "$stage/"
          cp README.md KEYBINDINGS.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hoot-${{ matrix.target }}
          path: hoot-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  package-linux:
    # .deb and .rpm are x86_64-only for now — see packaging/README.md for
    # adding an arm64 pass if it's ever worth the extra CI time.
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Pinned, like every action above: "whatever is newest the day the
      # tag is pushed" is not a reproducible build input, and a packaging
      # tool that changes its output between two releases of hoot is a
      # difference nobody asked for and nobody would notice.
      - run: cargo install cargo-deb@3.7.0 cargo-generate-rpm@0.21.0 --locked

      - run: cargo build --release --locked

      - run: cargo deb --no-build
      - run: cargo generate-rpm

      # Staged into one flat directory before upload: upload-artifact uses
      # the *least common ancestor* of multiple path inputs as the
      # artifact root, so uploading target/debian/*.deb and
      # target/generate-rpm/*.rpm directly would nest them as
      # debian/*.deb and generate-rpm/*.rpm inside the artifact instead of
      # top-level files — which the release job's `sha256sum *` and
      # `files: dist/*` glob wouldn't pick up correctly.
      - run: mkdir dist-stage && cp target/debian/*.deb target/generate-rpm/*.rpm dist-stage/

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hoot-deb-rpm
          path: dist-stage/*

  verify-packages:
    # Building a .deb and an .rpm proves the packaging metadata parses. It
    # does not prove either one installs, that the declared dependencies
    # are the real ones, or that the binary inside runs on the
    # distribution it is aimed at — a release-day discovery otherwise,
    # since nothing else here ever installs what it ships. Each package is
    # installed into a clean container of its target distribution and the
    # installed binary is run from PATH.
    needs: package-linux
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            container: debian:stable
          - name: fedora
            container: fedora:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: hoot-deb-rpm
          path: dist

      # `apt-get install ./file.deb` (rather than `dpkg -i`) so the
      # dependencies the package declares — `$auto` plus git — are
      # resolved and installed too. A missing runtime dependency is
      # exactly the kind of thing this job exists to catch, and `dpkg -i`
      # would leave it unconfigured instead of failing.
      - name: Install the .deb and run it
        if: matrix.name == 'debian'
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ./dist/*.deb
          command -v hoot
          hoot --version

      - name: Install the .rpm and run it
        if: matrix.name == 'fedora'
        run: |
          set -eux
          dnf install -y ./dist/*.rpm
          command -v hoot
          hoot --version

  release:
    needs: [build, package-linux, verify-packages]
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/*
          generate_release_notes: true
