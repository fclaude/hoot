# Runs on every push and pull request, so a break is found on the day it
# lands rather than on release day. The release workflow re-runs all of
# this before it builds anything — this exists to make that re-run a
# formality instead of the first time any of it is checked.
#
# Debian, Fedora and macOS: nearly everything here shells out to `git` and
# touches the filesystem (path bytes, symlinks, file modes, temp dirs), and
# those are exactly the things that differ between platforms. The two Linux
# rows are the distributions this is actually run on, in their own
# containers, rather than one Ubuntu row standing in for both.
#
# Every action is pinned to a commit SHA, not a mutable tag, and each job
# gets only the permissions it needs — see
# https://docs.github.com/actions/security-guides/security-hardening-for-github-actions.

name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC — for the advisory scan below, which can start
    # failing without a single commit having happened.
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  # A newer push to the same branch/PR makes an in-flight run redundant.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub hosts no Fedora or Debian runner, so the Linux rows run
          # in the distribution's own container on an Ubuntu host. That is
          # the difference between testing on Fedora and testing on Ubuntu
          # and hoping Fedora behaves the same: different glibc, different
          # git build, different default git config.
          #
          # These two tags float, unlike every action here, which is
          # pinned to a SHA. That is deliberate and the opposite tradeoff:
          # an action changing under us is a reproducibility problem,
          # whereas the distributions moving is the thing being tested —
          # pinning them would mean still passing against a Fedora nobody
          # runs any more.
          - name: debian
            os: ubuntu-latest
            container: debian:stable
          - name: fedora
            os: ubuntu-latest
            container: fedora:latest
          - name: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before checkout, not after: these images ship without git, and
      # actions/checkout quietly falls back to downloading a tarball when
      # git is missing. That would leave the whole suite running against a
      # directory that is not a git repository — for a tool whose every
      # test shells out to git, a uniquely useless way to pass.
      - name: Install prerequisites (Debian)
        if: matrix.name == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gcc libc6-dev
      - name: Install prerequisites (Fedora)
        if: matrix.name == 'fedora'
        # No curl here, unlike the Debian row: the Fedora image already
        # ships curl-minimal, and asking for `curl` makes dnf try to swap
        # the two rather than treat the need as already met.
        run: dnf install -y git gcc

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      # The test suite creates real git repositories in a temp dir and
      # commits to them, which needs an identity to exist somewhere. Every
      # scratch repo sets its own local user.name/user.email, so this is
      # only a backstop for anything that doesn't.
      - name: Give git an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          # The container runs as root over a workspace owned by the
          # host's runner user, which git refuses to touch until told the
          # mismatch is expected.
          git config --global --add safe.directory '*'

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Docs build clean
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked

      - name: KEYBINDINGS.md matches the keymap
        # The file is generated from src/keymap.rs; nothing but habit keeps
        # the checked-in copy current after a binding changes.
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --print-keymap > /tmp/keybindings.md
          diff -u KEYBINDINGS.md /tmp/keybindings.md \
            || { echo "::error::KEYBINDINGS.md is stale — run 'cargo run -- --print-keymap > KEYBINDINGS.md'"; exit 1; }

      - name: Crate packages cleanly
        run: cargo package --locked --allow-dirty

  audit:
    # Split out and Linux-only: it builds cargo-audit from source, which is
    # slower than everything above put together, and its result doesn't vary
    # by platform. The schedule matters as much as the push trigger — a new
    # advisory against an unchanged dependency is exactly the failure this
    # catches, and no commit will announce it.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Dependency advisory scan
        # Kept byte-identical to the release workflow's copy on purpose —
        # if the two ever disagree, the release is the one that fails, at
        # the worst possible moment. See release.yml for why each
        # `--ignore` is there.
        run: |
          cargo install cargo-audit@0.22.2 --locked
          cargo audit -D warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0253
